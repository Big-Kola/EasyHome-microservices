apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: easyhomes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 811800851991.dkr.ecr.us-east-2.amazonaws.com/easyhomes/order-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/easyhomes
            - name: PORT
              value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: easyhomes
spec:
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002
