apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: easyhomes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: easyhomes/product-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/easyhomes
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: easyhomes
spec:
  selector:
    app: product-service
  ports:
    - port: 3001
      targetPort: 3001
