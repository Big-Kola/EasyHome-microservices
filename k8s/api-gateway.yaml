apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: easyhomes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: easyhomes/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PRODUCT_SERVICE
              value: http://product-service:3001
            - name: ORDER_SERVICE
              value: http://order-service:3002
            - name: USER_SERVICE
              value: http://user-service:3003
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: easyhomes
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
