apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easyhomes-ingress
  namespace: easyhomes
spec:
  rules:
    - host: easyhomes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
