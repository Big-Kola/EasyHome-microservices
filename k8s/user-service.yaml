apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: easyhomes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 811800851991.dkr.ecr.us-east-2.amazonaws.com/easyhomes/user-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/easyhomes
            - name: PORT
              value: "3003"
            - name: JWT_SECRET
              value: "easyhomes_secret_key_change_in_production"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: easyhomes
spec:
  selector:
    app: user-service
  ports:
    - port: 3003
      targetPort: 3003
